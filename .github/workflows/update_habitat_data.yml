name: Update Habitat GeoJSON from Google Drive

on:
  repository_dispatch:
    types: [new-habitat-gpkg-file]

concurrency:
  group: dashboard-generated-data-writes
  cancel-in-progress: false

jobs:
  build-and-commit-habitat:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install GDAL and other dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev

      - name: Install Python packages
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-workflows.txt

      - name: Authenticate to Google Drive
        run: echo '${{ secrets.GDRIVE_CREDENTIALS_DATA }}' > gdrive-credentials.json

      - name: Download .gpkg file from Google Drive (service account)
        run: python download_from_gdrive.py "${{ github.event.client_payload.file_id }}" "habitat-data.gpkg"

      - name: Run habitat conversion script
        run: python habitatgpkgconversiontogeojson.py habitat-data.gpkg data

      - name: Commit and push if there are changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/habitats_*.geojson
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Feat: Update annual habitat GeoJSON data"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
