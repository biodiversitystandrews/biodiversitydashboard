name: Validate Dashboard Code

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "requirements*.txt"
      - "tests/**"
      - "scripts/**"
      - "frontend/*.html"
      - "frontend/*.js"
      - ".github/workflows/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install native GIS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-workflows.txt

      - name: Compile Python
        run: python -m compileall -q .

      - name: Check Google Drive workflow contracts
        run: python scripts/check_workflow_contracts.py

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Parse frontend JavaScript
        run: node scripts/check_inline_javascript.js
